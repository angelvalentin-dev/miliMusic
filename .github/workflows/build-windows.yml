name: 🪟 Build Windows Desktop (MSI / EXE / ZIP)

on:
  workflow_dispatch:
    inputs:
      formato:
        description: "Paquete a generar (artefactos separados)"
        required: true
        type: choice
        default: todos
        options: [ todos, exe, msi, portable ]

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Desktop
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Asegurar WiX Toolset 3.x (para MSI/EXE)
        if: inputs.formato != 'portable'
        shell: pwsh
        run: |
          $wixDefault = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path "$wixDefault\candle.exe") {
              "$wixDefault" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset -y --no-progress
              if (Test-Path "$wixDefault\candle.exe") {
                "$wixDefault" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Compilar helpers nativos Windows (WebView2 Login + SMTC DLL)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "desktop/resources/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "desktop/native/packages/webview2" | Out-Null

          curl.exe -fSL "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -o "desktop/native/packages/webview2.zip"
          Expand-Archive -Path "desktop/native/packages/webview2.zip" -DestinationPath "desktop/native/packages/webview2" -Force

          $wv2Inc = "desktop/native/packages/webview2/build/native/include"
          $wv2Lib = "desktop/native/packages/webview2/build/native/x64/WebView2Loader.dll.lib"
          Copy-Item "desktop/native/packages/webview2/build/native/x64/WebView2Loader.dll" "desktop/resources/windows/WebView2Loader.dll" -Force

          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE /I"$wv2Inc" `
            "desktop/native/webview2-login/main.cpp" `
            /Fe:"desktop/resources/windows/milimusic-login.exe" `
            /link "$wv2Lib" user32.lib shell32.lib ole32.lib oleaut32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cl /nologo /O2 /EHsc /std:c++20 /LD /DUNICODE /D_UNICODE `
            "desktop/native/smtc-bridge/smtc_bridge.cpp" `
            /Fe:"desktop/resources/windows/milimusic_smtc.dll" `
            /link windowsapp.lib ole32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item "desktop/resources/windows/*.exp", "desktop/resources/windows/*.lib", "*.obj" -ErrorAction SilentlyContinue

      - name: Descargar y empaquetar libVLC 3.0.21 solo audio (win64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vlcUrl = "https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.7z"
          curl.exe -fSL "$vlcUrl" -o "desktop/native/vlc.7z"
          7z x "desktop/native/vlc.7z" "-odesktop/native/vlc-extract" -y | Out-Null
          $vlcRoot = (Get-ChildItem "desktop/native/vlc-extract" -Directory | Select-Object -First 1).FullName

          $targetVlc = "desktop/resources/windows/vlc"
          $targetPlugins = "$targetVlc/plugins"
          New-Item -ItemType Directory -Force -Path $targetPlugins | Out-Null
          Copy-Item "$vlcRoot/libvlc.dll" "$targetVlc/" -Force
          Copy-Item "$vlcRoot/libvlccore.dll" "$targetVlc/" -Force

          # Solo plugins de audio, HTTP/archivo y demuxers/codecs necesarios (--no-video)
          foreach ($dir in @("audio_output", "audio_filter", "audio_mixer", "logger")) {
            if (Test-Path "$vlcRoot/plugins/$dir") {
              Copy-Item "$vlcRoot/plugins/$dir" "$targetPlugins/$dir" -Recurse -Force
            }
          }

          $whitelist = @{
            access = @("libhttp_plugin.dll", "libhttps_plugin.dll", "libfilesystem_plugin.dll", "libaccess_concat_plugin.dll", "libavio_plugin.dll")
            codec = @("libavcodec_plugin.dll", "libopus_plugin.dll", "libvorbis_plugin.dll", "libflac_plugin.dll", "libfaad_plugin.dll", "libmpg123_plugin.dll", "libmft_plugin.dll", "liblpcm_plugin.dll", "libaraw_plugin.dll")
            demux = @("libmp4_plugin.dll", "libmkv_plugin.dll", "libogg_plugin.dll", "libes_plugin.dll", "libflacsys_plugin.dll", "libwav_plugin.dll", "libcaf_plugin.dll", "libaiff_plugin.dll", "libplaylist_plugin.dll", "libadaptive_plugin.dll")
            misc = @("libxml_plugin.dll", "libgnutls_plugin.dll", "liblogger_plugin.dll", "libstats_plugin.dll")
            packetizer = @("libpacketizer_copy_plugin.dll", "libpacketizer_flac_plugin.dll", "libpacketizer_mpeg4audio_plugin.dll", "libpacketizer_mpegaudio_plugin.dll", "libpacketizer_a52_plugin.dll", "libpacketizer_dts_plugin.dll")
            stream_filter = @("libcache_read_plugin.dll", "libcache_block_plugin.dll", "libprefetch_plugin.dll", "libskiptags_plugin.dll", "libinflate_plugin.dll")
          }
          foreach ($cat in $whitelist.Keys) {
            $dstDir = "$targetPlugins/$cat"
            New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
            foreach ($dll in $whitelist[$cat]) {
              $src = "$vlcRoot/plugins/$cat/$dll"
              if (Test-Path $src) {
                Copy-Item $src "$dstDir/" -Force
              }
            }
          }

          & "$vlcRoot/vlc-cache-gen.exe" "$targetPlugins"
          $vlcMb = [math]::Round(((Get-ChildItem $targetVlc -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
          Write-Host "libVLC recortado: $vlcMb MB"

      - name: Ejecutar tests y empaquetar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tasks = @(":innertube:test", ":desktop:test")
          $fmt = "${{ inputs.formato }}"
          if ($fmt -eq "todos" -or $fmt -eq "exe") { $tasks += ":desktop:packageExe" }
          if ($fmt -eq "todos" -or $fmt -eq "msi") { $tasks += ":desktop:packageMsi" }
          if ($fmt -eq "todos" -or $fmt -eq "portable") { $tasks += ":desktop:createDistributable" }
          ./gradlew @tasks --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crear ZIP portable (compresión óptima)
        if: inputs.formato == 'todos' || inputs.formato == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = "desktop/build/compose/binaries/main/app/miliMusic"
          if (-not (Test-Path $distDir)) {
            throw "No se encontró el directorio distribuible en $distDir"
          }
          New-Item -ItemType Directory -Force -Path "desktop/build/portable" | Out-Null
          Compress-Archive -Path "$distDir\*" -DestinationPath "desktop/build/portable/miliMusic-windows-x64-portable.zip" -CompressionLevel Optimal -Force

      - name: Subir instalador EXE
        if: inputs.formato == 'todos' || inputs.formato == 'exe'
        uses: actions/upload-artifact@v4
        with:
          name: miliMusic-windows-x64-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Subir instalador MSI
        if: inputs.formato == 'todos' || inputs.formato == 'msi'
        uses: actions/upload-artifact@v4
        with:
          name: miliMusic-windows-x64-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Subir versión portable ZIP
        if: inputs.formato == 'todos' || inputs.formato == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: miliMusic-windows-x64-portable
          path: desktop/build/portable/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Resumen de tamaños
        shell: pwsh
        run: |
          $lines = @("## 🪟 Build Windows x64", "")
          foreach ($glob in @("desktop/build/compose/binaries/main/exe/*.exe", "desktop/build/compose/binaries/main/msi/*.msi", "desktop/build/portable/*.zip")) {
            Get-ChildItem $glob -ErrorAction SilentlyContinue | ForEach-Object {
              $mb = [math]::Round($_.Length / 1MB, 1)
              $lines += "- **$($_.Name)**: $mb MB"
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
